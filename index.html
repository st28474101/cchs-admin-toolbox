r:#64748b;line-height:1.6}.status{min-height:22px;color:#0f766e;font-size:14px;font-weight:bold}.toprow{display:flex;align-items:center;gap:15px;justify-content:space-between;flex-wrap:wrap}.summarytable td,.summarytable th{text-align:right}.summarytable td:first-child,.summarytable th:first-child{text-align:left}.summarytable{white-space:normal}.warning{color:#a16207}@media(max-width:650px){main{padding:12px}.panel{padding:15px}h1{font-size:23px}.choice{width:100%}.actions button{flex:1}}

&lt;body&gt;&lt;main&gt;
&lt;header&gt;&lt;h1&gt;九年級｜簡章購買意願調查&lt;/h1&gt;&lt;div class=&quot;hint&quot;&gt;901–906 班｜依座號登錄｜金額自動加總｜資料只儲存在目前瀏覽器&lt;/div&gt;&lt;/header&gt;
&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;① 輸入學生資料&lt;/h2&gt;&lt;div class=&quot;fields&quot;&gt;&lt;label&gt;班級&lt;select id=&quot;klass&quot;&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;座號&lt;select id=&quot;seat&quot;&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;
&lt;p style=&quot;font-weight:650;margin-bottom:10px&quot;&gt;勾選購買項目（可複選）&lt;/p&gt;&lt;div class=&quot;choices&quot; id=&quot;options&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;toprow&quot; style=&quot;margin-top:18px&quot;&gt;&lt;div&gt;本位學生合計：&lt;span class=&quot;money&quot; id=&quot;studentTotal&quot;&gt;NT$ 0&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;actions&quot; style=&quot;margin-top:0&quot;&gt;&lt;button id=&quot;save&quot;&gt;儲存／更新此學生&lt;/button&gt;&lt;button class=&quot;secondary&quot; id=&quot;clearForm&quot;&gt;清空勾選&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;p id=&quot;status&quot; class=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;&lt;div class=&quot;hint&quot;&gt;已登錄學生再次選取班級與座號時，會自動帶入原來的勾選結果；儲存可直接覆蓋更新。&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;panel&quot;&gt;&lt;div class=&quot;toprow&quot;&gt;&lt;h2&gt;② 已輸入清單&lt;/h2&gt;&lt;label&gt;篩選班級 &lt;select id=&quot;filter&quot;&gt;&lt;option value=&quot;ALL&quot;&gt;全部班級&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;stats&quot; id=&quot;stats&quot;&gt;&lt;/div&gt;&lt;p class=&quot;hint&quot; id=&quot;rowCount&quot;&gt;&lt;/p&gt;&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;班級&lt;/th&gt;&lt;th&gt;座號&lt;/th&gt;&lt;th&gt;會考&lt;br&gt;15元&lt;/th&gt;&lt;th&gt;高中優免&lt;br&gt;50元&lt;/th&gt;&lt;th&gt;基北免試&lt;br&gt;100元&lt;/th&gt;&lt;th&gt;五專優免&lt;br&gt;60元&lt;/th&gt;&lt;th&gt;五專免試&lt;br&gt;60元&lt;/th&gt;&lt;th&gt;合計&lt;/th&gt;&lt;th&gt;操作&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;rows&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;③ 各班統計&lt;/h2&gt;&lt;div class=&quot;tablewrap&quot;&gt;&lt;table class=&quot;summarytable&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;班級&lt;/th&gt;&lt;th&gt;已登錄&lt;/th&gt;&lt;th&gt;會考&lt;/th&gt;&lt;th&gt;高中優免&lt;/th&gt;&lt;th&gt;基北免試&lt;/th&gt;&lt;th&gt;五專優免&lt;/th&gt;&lt;th&gt;五專免試&lt;/th&gt;&lt;th&gt;總金額&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;summary&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;④ 匯出 Excel 與資料備份&lt;/h2&gt;&lt;div class=&quot;actions&quot;&gt;&lt;button id=&quot;exportExcel&quot;&gt;匯出 Excel（各班獨立工作表）&lt;/button&gt;&lt;button id=&quot;exportCurrent&quot; class=&quot;secondary&quot;&gt;匯出目前班級 CSV&lt;/button&gt;&lt;button id=&quot;exportAllCsv&quot; class=&quot;secondary&quot;&gt;匯出全部 CSV&lt;/button&gt;&lt;button id=&quot;backup&quot; class=&quot;secondary&quot;&gt;備份資料 JSON&lt;/button&gt;&lt;button id=&quot;restoreBtn&quot; class=&quot;secondary&quot;&gt;還原備份 JSON&lt;/button&gt;&lt;input type=&quot;file&quot; id=&quot;restore&quot; accept=&quot;.json,application/json&quot; hidden&gt;&lt;/div&gt;
&lt;p class=&quot;foot&quot;&gt;Excel 匯出使用線上程式庫，第一次使用時需要網路；CSV 則可以離線匯出，且可用 Excel 開啟。工作簿含「全校清單」、「班級統計」以及 901–906 六個獨立分頁。所有未勾選任何項目但已按儲存的學生，也會記錄為 0 元，方便確認已調查但不購買。&lt;/p&gt;&lt;p class=&quot;foot warning&quot;&gt;重要：資料只保留在這台裝置的這個瀏覽器。更換手機／電腦、清除瀏覽器資料或使用無痕模式可能導致資料消失。建議每次輸入一批後按「備份資料 JSON」，並定期匯出 Excel。&lt;/p&gt;&lt;/section&gt;
&lt;/main&gt;
&lt;script&gt;
(()=&gt;{
&#x27;use strict&#x27;;
const ITEMS=[[&#x27;exam&#x27;,&#x27;會考&#x27;,15],[&#x27;high&#x27;,&#x27;高中優免&#x27;,50],[&#x27;joint&#x27;,&#x27;基北免試&#x27;,100],[&#x27;fivePriority&#x27;,&#x27;五專優免&#x27;,60],[&#x27;fiveGeneral&#x27;,&#x27;五專免試&#x27;,60]];
const CLASSES=[&#x27;901&#x27;,&#x27;902&#x27;,&#x27;903&#x27;,&#x27;904&#x27;,&#x27;905&#x27;,&#x27;906&#x27;]; const KEY=&#x27;grade9_booklets_2026_v1&#x27;;
const $=id=&gt;document.getElementById(id);let data={};
function seats(cls){return [...Array(16)].map((_,i)=&gt;i+1).concat([...Array(cls===&#x27;906&#x27;?24:15)].map((_,i)=&gt;i+21));}
function key(c,s){return c+&#x27;-&#x27;+s;}function sum(a){return ITEMS.reduce((n,[id,,price])=&gt;n+(a[id]?price:0),0)}
function sorted(){return Object.values(data).sort((a,b)=&gt;Number(a.class)-Number(b.class)||a.seat-b.seat)}
function dollars(n){return &#x27;NT$ &#x27;+n.toLocaleString(&#x27;zh-TW&#x27;)}
function notify(t){$(&#x27;status&#x27;).textContent=t;}
function load(){try{let raw=JSON.parse(localStorage.getItem(KEY)||&#x27;{}&#x27;);if(raw &amp;&amp; typeof raw===&#x27;object&#x27; &amp;&amp; !Array.isArray(raw))data=raw;}catch(e){notify(&#x27;讀取舊資料失敗，請先還原備份。&#x27;)}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true;}catch(e){alert(&#x27;瀏覽器儲存失敗，請先備份資料。&#x27;);return false;}}
function setSeats(){let prev=$(&#x27;seat&#x27;).value;$(&#x27;seat&#x27;).innerHTML=seats($(&#x27;klass&#x27;).value).map(s=&gt;`&lt;option value=&quot;${s}&quot;&gt;${s.toString().padStart(2,&#x27;0&#x27;)}&lt;/option&gt;`).join(&#x27;&#x27;);if(seats($(&#x27;klass&#x27;).value).includes(Number(prev)))$(&#x27;seat&#x27;).value=prev;setChecksFromData();}
function setChecksFromData(){let d=data[key($(&#x27;klass&#x27;).value,Number($(&#x27;seat&#x27;).value))];ITEMS.forEach(([id])=&gt;{$(&#x27;cb_&#x27;+id).checked=!!(d&amp;&amp;d[id]);});total();}
function total(){$(&#x27;studentTotal&#x27;).textContent=dollars(sum(Object.fromEntries(ITEMS.map(([id])=&gt;[id,$(&#x27;cb_&#x27;+id).checked]))));}
function render(){let all=sorted(),current=$(&#x27;filter&#x27;).value,filtered=all.filter(d=&gt;current===&#x27;ALL&#x27;||d.class===current);$(&#x27;rowCount&#x27;).textContent=`目前顯示 ${filtered.length} 筆／全校已登錄 ${all.length} 筆`;
$(&#x27;rows&#x27;).innerHTML=filtered.length?filtered.map(d=&gt;`&lt;tr&gt;&lt;td&gt;${d.class}&lt;/td&gt;&lt;td&gt;${String(d.seat).padStart(2,&#x27;0&#x27;)}&lt;/td&gt;${ITEMS.map(([id])=&gt;`&lt;td class=&quot;${d[id]?&#x27;tick&#x27;:&#x27;muted&#x27;}&quot;&gt;${d[id]?&#x27;✓&#x27;:&#x27;－&#x27;}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;td&gt;&lt;b&gt;${dollars(sum(d))}&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;button class=&quot;secondary&quot; data-edit=&quot;${key(d.class,d.seat)}&quot; style=&quot;padding:5px 9px&quot;&gt;修改&lt;/button&gt; &lt;button class=&quot;danger&quot; data-delete=&quot;${key(d.class,d.seat)}&quot; style=&quot;padding:5px 9px&quot;&gt;刪除&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;):&#x27;&lt;tr&gt;&lt;td colspan=&quot;9&quot;&gt;尚無登錄資料&lt;/td&gt;&lt;/tr&gt;&#x27;;
$(&#x27;stats&#x27;).innerHTML=`&lt;div class=&quot;stat&quot;&gt;&lt;strong&gt;${all.length}&lt;/strong&gt;&lt;span&gt;已登錄學生&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;strong&gt;${dollars(all.reduce((n,d)=&gt;n+sum(d),0))}&lt;/strong&gt;&lt;span&gt;全校簡章總金額&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;strong&gt;${all.filter(d=&gt;sum(d)===0).length}&lt;/strong&gt;&lt;span&gt;已登錄但未購買&lt;/span&gt;&lt;/div&gt;`;
let aggregate=(records)=&gt;({n:records.length,counts:ITEMS.map(([id])=&gt;records.filter(d=&gt;d[id]).length),amount:records.reduce((n,d)=&gt;n+sum(d),0)});
$(&#x27;summary&#x27;).innerHTML=[...CLASSES,&#x27;總計&#x27;].map(cls=&gt;{let a=aggregate(cls===&#x27;總計&#x27;?all:all.filter(d=&gt;d.class===cls));return `&lt;tr&gt;&lt;td&gt;&lt;b&gt;${cls}&lt;/b&gt;&lt;/td&gt;&lt;td&gt;${a.n}&lt;/td&gt;${a.counts.map(x=&gt;`&lt;td&gt;${x}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;td&gt;&lt;b&gt;${dollars(a.amount)}&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;`;}).join(&#x27;&#x27;);}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement(&#x27;a&#x27;);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=&gt;URL.revokeObjectURL(u),3000)}
function csvCell(x){let s=String(x??&#x27;&#x27;);return /[&quot;,\r\n]/.test(s)?&#x27;&quot;&#x27;+s.replace(/&quot;/g,&#x27;&quot;&quot;&#x27;)+&#x27;&quot;&#x27;:s}
function rowsFor(records){return [[&#x27;班級&#x27;,&#x27;座號&#x27;,...ITEMS.map(x=&gt;x[1]+&#x27;（&#x27;+x[2]+&#x27;元）&#x27;),&#x27;總金額&#x27;],...records.map(d=&gt;[d.class,String(d.seat).padStart(2,&#x27;0&#x27;),...ITEMS.map(([id])=&gt;d[id]?1:0),sum(d)])]}
function exportCSV(records,name){let csv=rowsFor(records).map(row=&gt;row.map(csvCell).join(&#x27;,&#x27;)).join(&#x27;\r\n&#x27;);download(new Blob([&#x27;\ufeff&#x27;+csv],{type:&#x27;text/csv;charset=utf-8&#x27;}),name)}
function exportWorkbook(){if(!window.XLSX){alert(&#x27;Excel 功能需要網路載入程式庫。可先按「匯出全部 CSV」，或連線後再試。&#x27;);return;}let wb=XLSX.utils.book_new(),all=sorted(),sheet=arr=&gt;XLSX.utils.aoa_to_sheet(arr);XLSX.utils.book_append_sheet(wb,sheet(rowsFor(all)),&#x27;全校清單&#x27;);let sums=[[&#x27;班級&#x27;,&#x27;已登錄人數&#x27;,...ITEMS.map(x=&gt;x[1]+&#x27;數量&#x27;),&#x27;總金額&#x27;]];for(let c of CLASSES){let subset=all.filter(d=&gt;d.class===c);sums.push([c,subset.length,...ITEMS.map(([id])=&gt;subset.filter(d=&gt;d[id]).length),subset.reduce((n,d)=&gt;n+sum(d),0)]);XLSX.utils.book_append_sheet(wb,sheet(rowsFor(subset)),c+&#x27;班&#x27;);}sums.push([&#x27;總計&#x27;,all.length,...ITEMS.map(([id])=&gt;all.filter(d=&gt;d[id]).length),all.reduce((n,d)=&gt;n+sum(d),0)]);XLSX.utils.book_append_sheet(wb,sheet(sums),&#x27;班級統計&#x27;);XLSX.writeFile(wb,&#x27;九年級簡章意願調查_各班統計.xlsx&#x27;);}
function init(){CLASSES.forEach(c=&gt;{$(&#x27;klass&#x27;).add(new Option(c,c));$(&#x27;filter&#x27;).add(new Option(c+&#x27;班&#x27;,c));});$(&#x27;options&#x27;).innerHTML=ITEMS.map(([id,name,price])=&gt;`&lt;label class=&quot;choice&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cb_${id}&quot;&gt;&lt;span&gt;${name} &lt;b&gt;${price} 元&lt;/b&gt;&lt;/span&gt;&lt;/label&gt;`).join(&#x27;&#x27;);ITEMS.forEach(([id])=&gt;$(&#x27;cb_&#x27;+id).addEventListener(&#x27;change&#x27;,total));load();setSeats();$(&#x27;klass&#x27;).onchange=setSeats;$(&#x27;seat&#x27;).onchange=setChecksFromData;$(&#x27;filter&#x27;).onchange=render;
$(&#x27;save&#x27;).onclick=()=&gt;{let c=$(&#x27;klass&#x27;).value,s=Number($(&#x27;seat&#x27;).value),record={class:c,seat:s};ITEMS.forEach(([id])=&gt;record[id]=$(&#x27;cb_&#x27;+id).checked);data[key(c,s)]=record;if(persist()){notify(`已儲存 ${c} 班 ${String(s).padStart(2,&#x27;0&#x27;)} 號，合計 ${dollars(sum(record))}`);render();}};
$(&#x27;clearForm&#x27;).onclick=()=&gt;{ITEMS.forEach(([id])=&gt;$(&#x27;cb_&#x27;+id).checked=false);total();notify(&#x27;已清空畫面勾選，按「儲存／更新」才會修改紀錄。&#x27;);};
$(&#x27;rows&#x27;).onclick=e=&gt;{let edit=e.target.closest(&#x27;[data-edit]&#x27;),del=e.target.closest(&#x27;[data-delete]&#x27;);if(edit){let d=data[edit.dataset.edit];$(&#x27;klass&#x27;).value=d.class;setSeats();$(&#x27;seat&#x27;).value=String(d.seat);setChecksFromData();window.scrollTo({top:0,behavior:&#x27;smooth&#x27;});notify(`正在修改 ${d.class} 班 ${d.seat} 號`);}else if(del){let k=del.dataset.delete;if(confirm(`確定刪除 ${k.replace(&#x27;-&#x27;,&#x27; 班 &#x27;)} 號的資料嗎？`)){delete data[k];persist();render();setChecksFromData();notify(&#x27;已刪除該筆資料。&#x27;);}}};
$(&#x27;exportExcel&#x27;).onclick=exportWorkbook;$(&#x27;exportCurrent&#x27;).onclick=()=&gt;{let c=$(&#x27;filter&#x27;).value;if(c===&#x27;ALL&#x27;){alert(&#x27;請先在「篩選班級」選擇 901–906 其中一班。&#x27;);return;}exportCSV(sorted().filter(d=&gt;d.class===c),c+&#x27;班_簡章意願調查.csv&#x27;);};$(&#x27;exportAllCsv&#x27;).onclick=()=&gt;exportCSV(sorted(),&#x27;九年級_全部簡章意願調查.csv&#x27;);
$(&#x27;backup&#x27;).onclick=()=&gt;download(new Blob([JSON.stringify({format:&#x27;grade9_booklets_v1&#x27;,exportedAt:new Date().toISOString(),records:sorted()},null,2)],{type:&#x27;application/json&#x27;}),&#x27;九年級簡章調查_資料備份.json&#x27;);
$(&#x27;restoreBtn&#x27;).onclick=()=&gt;$(&#x27;restore&#x27;).click();$(&#x27;restore&#x27;).onchange=async e=&gt;{let f=e.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.format!==&#x27;grade9_booklets_v1&#x27;||!Array.isArray(obj.records))throw Error(&#x27;備份格式不正確&#x27;);let restored={};for(let d of obj.records){if(!CLASSES.includes(String(d.class))||!seats(String(d.class)).includes(Number(d.seat)))throw Error(&#x27;備份包含無效座號&#x27;);let r={class:String(d.class),seat:Number(d.seat)};ITEMS.forEach(([id])=&gt;r[id]=!!d[id]);restored[key(r.class,r.seat)]=r;}if(!confirm(`將以備份中的 ${Object.keys(restored).length} 筆紀錄覆蓋目前 ${Object.keys(data).length} 筆紀錄，確定嗎？`))return;data=restored;persist();setChecksFromData();render();notify(&#x27;備份已成功還原。&#x27;);}catch(err){alert(&#x27;還原失敗：&#x27;+err.message)}finally{e.target.value=&#x27;&#x27;;}};
render();}
init();
})();
